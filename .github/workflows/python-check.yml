name: Python check

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py shop scripts
      - name: Create app
        env:
          SECRET_KEY: github-actions-test-secret
          ADMIN_PASSWORD: github-actions-test-password
        run: python -c "from shop import create_app; app=create_app(); assert len(app.routes) > 0; print(f'Routes: {len(app.routes)}')"
