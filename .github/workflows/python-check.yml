name: Security and regression checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check installed graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app.py shop scripts
      - name: Regression tests
        env:
          APP_ENV: test
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: |
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock
      - name: Static security analysis
        run: python -m bandit -r shop scripts app.py
      - name: Redacted secret scan including history
        run: python scripts/scan_secrets.py --history
  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build -t tigr-security-check .
      - name: Validate Caddy configuration
        run: docker run --rm -e DOMAIN=shop.example.invalid -v "$PWD/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
